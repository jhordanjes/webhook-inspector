services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: webhooks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d webhooks"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: postgres -c max_connections=100 -c shared_buffers=128MB

volumes:
  postgres_data:
    driver: local
